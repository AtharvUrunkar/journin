    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B24D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E8B24D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8B24D"/>
      <stop offset="65%" stop-color="#CFCB6E"/>
      <stop offset="100%" stop-color="#35D6A9"/>
    </linearGradient>

    <linearGradient id="gaugeGrad" gradientUnits="userSpaceOnUse" x1="845" y1="935" x2="1035" y2="935">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#E8B24D"/>
      <stop offset="100%" stop-color="#35D6A9"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0C878"/>
      <stop offset="100%" stop-color="#C99A44"/>
    </linearGradient>

    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="shellClip">
